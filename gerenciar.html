<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_index.css">
    <title>Salgaderia Gorita - Gerenciar Ingredientes</title>
</head>
<body>
    <header>
        <h1>Gerenciar Ingredientes</h1>
        <p>Adicione novos ingredientes ou remova itens obsoletos do sistema</p>
    </header>

    <!-- Formulário para Adicionar Ingrediente -->
    
<div class="card-formulario">
  <h2>Cadastrar Novo Ingrediente</h2>
  <form id="form-cadastrar">
    <div class="form-group">
      <label for="nome">Nome do Ingrediente</label>
      <input type="text" id="nome" placeholder="Ex: Farinha de Trigo" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="quantidade">Quantidade Inicial</label>
        <input type="number" id="quantidade" placeholder="0" required min="0">
      </div>
      
      <div class="form-row-min-max">
        <div class="form-group">
          <label for="min">Mínimo</label>
          <input type="number" id="min" placeholder="0" required min="0">
        </div>
        <div class="form-group">
          <label for="max">Máximo</label>
          <input type="number" id="max" placeholder="100" required min="0">
        </div>
      </div>
    </div>

    <button type="submit" class="btn-adicionar">+ Adicionar Ingrediente</button>
  </form>
</div>

    <!-- Tabela para Listar e Remover Ingredientes -->
    <div id="Tabelas" style="margin-top: 30px;">
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Ingrediente</th>
                    <th>Quantidade Atual</th>
                    <th>Mín / Máx</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="manageTableBody">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>

    <div class="menu">
        <img src="./Assets/Logo.jpeg" alt="Logo">
        <button id="btnHome">Estoque</button>
        <button id="btnGerenciar" class="active-btn">Gerenciar</button>
        <button id="btnSair">Sair</button>
        <h2>Qualidade e sabor <u>em cada detalhe</u></h2>
    </div>

    <div class="funcionario">
        <p id="nomeFuncionario">Carregando...</p>
    </div>

    <script src="script_gerenciar.js"></script>
</body>
</html>

<!-- Exemplo de como deve ficar no HTML -->
<div class="user-profile">
  <span>👤 <strong id="nome-usuario">Carregando...</strong></span>
</div>
